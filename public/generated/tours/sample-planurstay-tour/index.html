<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sample Furnished Apartment · Virtual Tour</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b0f12;color:#fff}.shell{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.brand img{max-width:145px;max-height:44px;filter:brightness(0) invert(1)}.title h1{font-size:clamp(22px,4vw,38px);margin:0}.title p{margin:5px 0 0;color:#aeb8c0}.stage{position:relative;border-radius:24px;overflow:hidden;background:#111;aspect-ratio:16/9;box-shadow:0 20px 70px #0008}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#111;transition:opacity .45s ease,transform 4s ease;opacity:0}.stage img.active{opacity:1;transform:scale(1.035)}.overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#000b 100%);pointer-events:none}.caption{position:absolute;left:22px;bottom:18px}.caption strong{font-size:21px;display:block}.caption span{color:#cbd5dc}.nav{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:14px;pointer-events:none}.nav button{pointer-events:auto;width:48px;height:48px;border-radius:50%;border:1px solid #ffffff55;background:#0008;color:#fff;font-size:24px;cursor:pointer}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.toolbar button,.cta{border:0;border-radius:12px;padding:12px 16px;background:#fff;color:#111;font-weight:750;text-decoration:none;cursor:pointer}.toolbar .secondary{background:#1c242a;color:#fff;border:1px solid #33414a}.rooms{display:flex;gap:8px;overflow:auto;padding:3px 0 8px}.room-chip{white-space:nowrap;border:1px solid #33414a;background:#151c21;color:#dce4e9;padding:10px 13px;border-radius:999px;cursor:pointer}.room-chip.active{background:#fff;color:#101417}.room-chip span{opacity:.6}.thumbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}.thumb{border:2px solid transparent;padding:0;background:none;border-radius:12px;overflow:hidden;cursor:pointer;aspect-ratio:4/3}.thumb.active{border-color:white}.thumb img{width:100%;height:100%;object-fit:cover}.truth{color:#93a0aa;font-size:12px;margin-top:12px}@media(max-width:640px){.shell{padding:10px}.top{align-items:flex-start}.brand img{max-width:110px}.stage{aspect-ratio:4/3}.caption{left:14px;bottom:12px}.nav button{width:42px;height:42px}.toolbar{display:grid;grid-template-columns:1fr 1fr}.cta{text-align:center}}</style></head><body><main class="shell"><div class="top"><div class="title"><h1>Sample Furnished Apartment</h1><p>Toronto, ON · 1 bed · 1 bath</p></div><div class="brand"><img src="https://planurstay.com/images/logo.png" alt="PlanURstay"></div></div><div class="stage" id="stage"><img src="/sample-tour/living-2.jpeg" alt="Living &amp; dining area" class="active" data-i="0"><img src="/sample-tour/living-1.jpeg" alt="Living area" class="" data-i="1"><img src="/sample-tour/kitchen.jpeg" alt="Kitchen" class="" data-i="2"><img src="/sample-tour/bedroom-2.jpeg" alt="Bedroom" class="" data-i="3"><img src="/sample-tour/bedroom-1.jpeg" alt="Bedroom angle" class="" data-i="4"><img src="/sample-tour/bathroom.jpeg" alt="Bathroom" class="" data-i="5"><img src="/sample-tour/laundry.jpeg" alt="In-suite laundry" class="" data-i="6"><div class="overlay"></div><div class="caption"><strong id="capRoom">Living Area</strong><span id="capLabel">Living &amp; dining area</span></div><div class="nav"><button id="prev" aria-label="Previous">‹</button><button id="next" aria-label="Next">›</button></div></div><div class="toolbar"><button id="start">▶ Start guided tour</button><button id="pause" class="secondary">Pause</button><a class="cta" href="https://planurstay.com" target="_blank" rel="noopener">Request Quote</a></div><div class="rooms"><button class="room-chip active" data-room="0">Living Area <span>2</span></button><button class="room-chip" data-room="1">Kitchen <span>1</span></button><button class="room-chip" data-room="2">Bedroom <span>2</span></button><button class="room-chip" data-room="3">Bathroom <span>1</span></button><button class="room-chip" data-room="4">Laundry <span>1</span></button></div><div class="thumbs" id="thumbs"></div><p class="truth">Built from the real supplied property photos. This tour does not reconstruct or invent room geometry.</p></main><script>const groups=[{"room":"Living Area","photos":[{"id":"feee72d9-9051-4681-a6ba-fe484bbbfafe","url":"/sample-tour/living-2.jpeg","room":"Living Area","label":"Living & dining area","order":0,"hero":true},{"id":"9d2bbebe-3070-4ddf-999a-9a7f2fea00bb","url":"/sample-tour/living-1.jpeg","room":"Living Area","label":"Living area","order":1,"hero":false}]},{"room":"Kitchen","photos":[{"id":"642ebcf4-de3c-4710-9b10-e1be3c01ba61","url":"/sample-tour/kitchen.jpeg","room":"Kitchen","label":"Kitchen","order":2,"hero":false}]},{"room":"Bedroom","photos":[{"id":"d4710e79-4b8e-40f7-a9bb-178798e3beec","url":"/sample-tour/bedroom-2.jpeg","room":"Bedroom","label":"Bedroom","order":3,"hero":false},{"id":"8e1d8f82-442d-4557-8530-4ade23b2eec0","url":"/sample-tour/bedroom-1.jpeg","room":"Bedroom","label":"Bedroom angle","order":4,"hero":false}]},{"room":"Bathroom","photos":[{"id":"e6042c77-32b4-41ed-bef3-7da6364509bb","url":"/sample-tour/bathroom.jpeg","room":"Bathroom","label":"Bathroom","order":5,"hero":false}]},{"room":"Laundry","photos":[{"id":"ad3618bb-1cdd-40ff-8ed5-a8e54c450144","url":"/sample-tour/laundry.jpeg","room":"Laundry","label":"In-suite laundry","order":6,"hero":false}]}];const flat=groups.flatMap(g=>g.photos.map(p=>({...p,room:g.room})));let idx=0,timer=null;const imgs=[...document.querySelectorAll('.stage img')],chips=[...document.querySelectorAll('.room-chip')],thumbs=document.getElementById('thumbs');function renderThumbs(){const room=flat[idx]?.room;const ps=flat.map((p,i)=>({p,i})).filter(x=>x.p.room===room);thumbs.innerHTML=ps.map(x=>'<button class="thumb '+(x.i===idx?'active':'')+'" data-i="'+x.i+'"><img src="'+x.p.url+'" alt=""></button>').join('');thumbs.querySelectorAll('button').forEach(b=>b.onclick=()=>show(Number(b.dataset.i)))}function show(n){idx=(n+flat.length)%flat.length;imgs.forEach((im,i)=>im.classList.toggle('active',i===idx));document.getElementById('capRoom').textContent=flat[idx]?.room||'';document.getElementById('capLabel').textContent=flat[idx]?.label||'';chips.forEach((c,i)=>c.classList.toggle('active',groups[i]?.room===flat[idx]?.room));renderThumbs()}function stop(){if(timer)clearInterval(timer);timer=null}document.getElementById('prev').onclick=()=>{stop();show(idx-1)};document.getElementById('next').onclick=()=>{stop();show(idx+1)};document.getElementById('start').onclick=()=>{stop();show(idx);timer=setInterval(()=>show(idx+1),3800)};document.getElementById('pause').onclick=stop;chips.forEach((c,i)=>c.onclick=()=>{stop();const room=groups[i]?.room;show(flat.findIndex(p=>p.room===room))});renderThumbs();</script></body></html>
