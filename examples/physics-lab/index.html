<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kairoq Physics Lab</title><style>body{font:16px system-ui;background:#0f1626;color:#f4f8ff;margin:0;padding:30px}main{max-width:980px;margin:auto}h1{font:52px Georgia,serif}fieldset{border:1px solid #536580;border-radius:14px;display:flex;gap:20px;flex-wrap:wrap;padding:20px}label{display:block}input{display:block;width:180px;margin:8px 0;padding:10px}button{background:#c3e8ca;color:#14221b;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}canvas{width:100%;height:360px;background:#162238;border-radius:16px;margin-top:20px}output{display:block;margin:12px 0;color:#c3e8ca}</style><main><small>REPRODUCIBLE SCIENCE</small><h1>Physics Simulation Lab</h1><p>Experiment with projectile motion and compare computed results with the analytical equations. SI units.</p><fieldset><label>Launch speed (m/s)<input id="speed" type="number" value="20" min="0" step="1"></label><label>Angle (degrees)<input id="angle" type="number" value="45" min="-90" max="90"></label><label>Gravity (m/s²)<input id="gravity" type="number" value="9.80665" step=".01" min=".01"></label><button id="run">Simulate</button></fieldset><output id="results" aria-live="polite"></output><canvas id="plot" width="900" height="360" aria-label="Projectile trajectory graph"></canvas><p>Model: ideal projectile with no drag, constant gravity, and equal launch/landing elevations. Real motion differs when air resistance matters.</p></main><script>
const $=id=>document.getElementById(id);
function simulate(){const v=+$('speed').value,a=+$('angle').value*Math.PI/180,g=+$('gravity').value;if(!Number.isFinite(v)||!Number.isFinite(g)||v<0||g<=0||Math.abs(a)>Math.PI/2){$('results').textContent='Invalid input';return}const vx=v*Math.cos(a),vy=v*Math.sin(a),t=(vy+Math.abs(vy))/g,range=vx*t,height=Math.max(0,vy)**2/(2*g);$('results').textContent='Flight '+t.toFixed(2)+' s · Range '+range.toFixed(2)+' m · Peak '+height.toFixed(2)+' m';const ctx=$('plot').getContext('2d');ctx.clearRect(0,0,900,360);ctx.strokeStyle='#adc1d7';ctx.beginPath();ctx.moveTo(32,330);ctx.lineTo(875,330);ctx.stroke();ctx.strokeStyle='#93dbb1';ctx.lineWidth=4;ctx.beginPath();for(let i=0;i<=160;i++){const ti=t*i/160,x=vx*ti,y=vy*ti-.5*g*ti*ti,px=32+(x/(range||1))*830,py=330-(y/(height||1))*280;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.stroke()}$('run').onclick=simulate;simulate();
</script></html>
