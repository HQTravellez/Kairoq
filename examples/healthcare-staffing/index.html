<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kairoq Staffing Scheduler</title><style>body{background:#f6f8fb;color:#203348;font:16px system-ui;margin:0;padding:28px}main{max-width:900px;margin:auto}h1{font:52px Georgia,serif}section{padding:22px;background:white;border:1px solid #dce4ee;border-radius:14px;margin:20px 0}button{padding:12px 18px;background:#244c71;color:white;border:0;border-radius:9px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:14px;text-align:left;border-bottom:1px solid #dae3ee}.bad{color:#ad3131}.good{color:#237043}</style><main><small>OPERATIONS • SYNTHETIC RECORDS</small><h1>Healthcare Staffing Scheduler</h1><p>Explore nurse shift eligibility, availability and overlapping-booking rules. This demo uses invented staff; it is not a patient care or clinical staffing system.</p><section><h2>Upcoming shifts</h2><table><thead><tr><th>Shift</th><th>Required role</th><th>Candidate</th><th>Result</th></tr></thead><tbody id="rows"></tbody></table></section><button id="run">Verify assignments</button><p id="result" aria-live="polite"></p></main><script>
const staff=[{id:'n1',name:'Alex',qualifications:['RN'],available:[{start:'2030-07-01T08:00:00Z',end:'2030-07-01T20:00:00Z'}]},{id:'n2',name:'Jordan',qualifications:['PSW'],available:[]}];const shifts=[{id:'a',site:'Test Clinic',role:'RN',start:'2030-07-01T09:00:00Z',end:'2030-07-01T14:00:00Z'},{id:'b',site:'Test Clinic',role:'RN',start:'2030-07-01T12:00:00Z',end:'2030-07-01T17:00:00Z'}];function check(s,p,assigned){let errs=[];if(!p.qualifications.includes(s.role))errs.push('Qualification missing');if(!p.available.some(a=>Date.parse(a.start)<=Date.parse(s.start)&&Date.parse(a.end)>=Date.parse(s.end)))errs.push('Not available');if(assigned.some(a=>a.staffId===p.id&&Date.parse(s.start)<Date.parse(a.end)&&Date.parse(s.end)>Date.parse(a.start)))errs.push('Overlapping shift');return errs}
document.getElementById('run').onclick=()=>{const assigned=[{...shifts[0],staffId:'n1'}];document.getElementById('rows').replaceChildren(...shifts.map(s=>{const row=document.createElement('tr'),person=staff[0],errors=check(s,person,s.id==='a'?[]:assigned);for(const value of [s.id+' · '+s.start.slice(11,16),s.role,person.name,errors.join(', ')||'Eligible']){const cell=document.createElement('td');cell.textContent=value;row.append(cell)}row.lastChild.className=errors.length?'bad':'good';return row}));document.getElementById('result').textContent='Verified against qualification, availability and overlapping shifts'};document.getElementById('run').click();
</script></html>
