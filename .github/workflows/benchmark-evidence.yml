name: Benchmark evidence
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      public_url:
        description: Public Kairoq HTTPS origin to verify
        required: true
      expected_sha:
        description: Deployed commit SHA (defaults to this workflow commit)
        required: false
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: apt-get update && apt-get install -y chromium fonts-liberation
      - run: test -x /usr/bin/chromium
      - run: npm run check
      - run: node --test test/api-learning.test.js test/complex-products.test.js test/builder-assets.test.js test/project-github.test.js test/project-portability.test.js test/studio-assets.test.js test/benchmark-gates.test.js test/evidence-route.test.js test/app-release.test.js test/design-pipeline.test.js test/website-benchmark.test.js test/website-release.test.js test/journey-qa.test.js test/real-visual-repair.test.js test/app-runtime.test.js test/app-platform.test.js test/app-platform-browser.test.js test/product-orchestration.test.js test/api-evolution.test.js test/api-oauth-sdk.test.js test/api-integration.test.js test/provider-sandbox-cli.test.js test/platform-panel-order.test.js test/developer-agent.test.js
      - name: Experimental adapters (no credentials or network required)
        run: node --test test/integration-lab.test.js test/decision-models.test.js
      - run: node --test --test-concurrency=2 test/design-progress.test.js test/generic-release-proof.test.js test/build-publication.test.js test/api-learning.test.js test/complex-products.test.js test/builder-assets.test.js test/project-github.test.js test/project-portability.test.js test/studio-assets.test.js test/benchmark-gates.test.js test/evidence-route.test.js test/app-release.test.js test/design-pipeline.test.js test/website-benchmark.test.js test/website-release.test.js test/journey-qa.test.js test/real-visual-repair.test.js test/app-runtime.test.js test/app-platform.test.js test/app-platform-browser.test.js test/product-orchestration.test.js test/api-evolution.test.js test/api-oauth-sdk.test.js test/api-integration.test.js test/provider-sandbox-cli.test.js test/developer-agent.test.js
        env:
          CHROMIUM_PATH: /usr/bin/chromium
      # Full image-era regression suite still runs in CI, without blocking Docker image compilation.
      - name: Full regression suite (former Dockerfile tests)
        run: node --test --test-concurrency=2 --test-timeout=300000 test/design-progress.test.js test/generic-release-proof.test.js test/build-publication.test.js test/product-orchestration.test.js test/api-backend.test.js test/api-bundle-docs.test.js test/magic-login.test.js test/api-studio.test.js test/api-oauth-sdk.test.js test/api-evolution.test.js test/api-integration.test.js test/api-learning.test.js test/complex-products.test.js test/builder-assets.test.js test/project-github.test.js test/project-portability.test.js test/studio-assets.test.js test/benchmark-gates.test.js test/evidence-route.test.js test/journey-qa.test.js test/design-pipeline.test.js test/app-release.test.js test/real-visual-repair.test.js test/app-runtime.test.js test/app-platform.test.js test/app-platform-browser.test.js test/developer-agent.test.js test/website-benchmark.test.js test/website-release.test.js test/website-capabilities.test.js test/visual-effects.test.js test/react-builder.test.js test/builder-budget.test.js test/create-tier1.test.js test/create-tier2.test.js test/create-tier3.test.js test/create-tier4.test.js test/create-tier5.test.js test/create-review-fixes.test.js test/create-mobile.test.js test/create-design.test.js test/model-eval.test.js test/create-checks.test.js test/builder-costs.test.js test/create-edits.test.js test/model-continue.test.js test/create-reference.test.js test/create-thinking.test.js test/security-hardening.test.js test/create-support.test.js test/synthetic-customers.test.js test/growth.test.js test/web.test.js test/automations.test.js test/mcp-build.test.js test/support.test.js test/site-check.test.js test/learning.test.js test/memory.test.js test/partners.test.js test/whatsapp.test.js test/hosting-billing.test.js test/app-assistant.test.js test/browser-agent.test.js test/batches.test.js test/web-replay.test.js test/template-thumbs.test.js test/chat-files.test.js test/preview-rebuild.test.js test/dead-clicks.test.js test/storage.test.js test/clarify.test.js test/setup-status.test.js test/rollback-journey.test.js test/site-search.test.js test/builder-provider.test.js test/app-referrals.test.js test/project-memory.test.js test/ai-checks.test.js test/compression.test.js test/code-editor.test.js test/postgres.test.js test/python-functions.test.js test/opencode-engine.test.js test/videos.test.js test/live-guard.test.js test/lightpanda.test.js test/feed-watch.test.js test/launch-gate.test.js test/outreach.test.js test/design-directions.test.js test/open-access.test.js test/experiential.test.js test/model-choices.test.js test/build-symlink.test.js test/project-thumbs.test.js test/model-paths.test.js
        env:
          CHROMIUM_PATH: /usr/bin/chromium
          NODE_ENV: production
          TZ: UTC
  deployed-benchmark:
    if: github.event_name == 'workflow_dispatch'
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/verify-benchmark.js
        env:
          KAIROQ_PUBLIC_URL: ${{ inputs.public_url }}
          KAIROQ_EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
          KAIROQ_BENCHMARK_PASSWORD: ${{ secrets.KAIROQ_BENCHMARK_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-benchmark-evidence
          path: benchmark-artifacts/
          if-no-files-found: ignore
