name: External tools pinned installation and read-only smoke
on:
  pull_request:
    paths:
      - 'scripts/external-tools-smoke.sh'
      - '.github/workflows/external-tool-install-smoke.yml'
      - 'Dockerfile'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official registry packages
        run: |
          python -m pip install --no-cache-dir cli-anything-hub==0.4.1
          npm install --global --no-audit --no-fund rea-agents@6.8.0
      - name: Read-only CLI and REA smoke test
        run: bash scripts/external-tools-smoke.sh
