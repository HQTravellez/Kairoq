name: Complex API workflow proof
on:
  push:
    branches:
      - feature/api-orchestration-tripninja-proof
  pull_request:
    paths:
      - 'api-workflow.js'
      - 'api-intelligence.js'
      - 'api-intelligence-pipeline.js'
      - 'test/api-workflow.test.js'
      - 'test/api-intelligence-pipeline.test.js'
      - 'test/api-jev-wiring.test.js'
      - 'api-product-intake.js'
      - 'public/api-studio.html'
      - 'test/automations.test.js'
      - 'scripts/audit-tripninja-public-contract.js'
      - '.github/workflows/complex-api-workflow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --check api-workflow.js
      - run: node --check api-intelligence.js
      - run: node --check api-intelligence-pipeline.js
      - run: node --check test/api-workflow.test.js
      - run: node --check test/api-intelligence-pipeline.test.js
      - run: node --test test/api-intelligence-pipeline.test.js test/api-jev-wiring.test.js test/api-workflow.test.js test/api-learning.test.js test/api-integration.test.js test/api-oauth-sdk.test.js test/automations.test.js

  legacy-tripninja-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download pinned official public Trip Ninja FareStructure spec (2023; read only)
        run: |
          curl --fail --location --retry 2 --max-time 30 --output /tmp/tn-api.yml \
            https://raw.githubusercontent.com/trip-ninja-inc/trip_ninja_api_docs/8966f0904269e0837c7383f731229242a79fedce/tn_api_spec.yml
      - name: Convert YAML to JSON for existing Kairoq OpenAPI importer
        run: |
          python3 -m pip install 'PyYAML==6.0.3'
          python3 -c 'import yaml,json; json.dump(yaml.safe_load(open("/tmp/tn-api.yml",encoding="utf-8")),open("/tmp/tn-api.json","w"))'
      - name: Audit actual published legacy contract and generated SDK syntax
        run: node scripts/audit-tripninja-public-contract.js /tmp/tn-api.json benchmark-artifacts/trip-ninja-legacy-contract-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trip-ninja-legacy-public-contract-audit
          path: benchmark-artifacts/trip-ninja-legacy-contract-audit.json
          if-no-files-found: warn
