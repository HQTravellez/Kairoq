name: GitHub and API intelligence
on:
  push:
    paths:
      - 'github-repository-intelligence.js'
      - 'capability-registry.js'
      - 'react-agent.js'
      - 'test/github-repository-intelligence.test.js'
      - 'test/agent-capability-routing.test.js'
      - 'repository-review-contract.js'
      - 'test/repository-review-contract.test.js'
      - '.github/workflows/github-api-intelligence.yml'
  pull_request:
    paths:
      - 'github-repository-intelligence.js'
      - 'capability-registry.js'
      - 'react-agent.js'
      - 'test/github-repository-intelligence.test.js'
      - 'test/agent-capability-routing.test.js'
      - 'repository-review-contract.js'
      - 'test/repository-review-contract.test.js'
      - '.github/workflows/github-api-intelligence.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check github-repository-intelligence.js
      - run: node --check capability-registry.js
      - run: node --check react-agent.js
      - run: node --check repository-review-contract.js
      - run: node --test test/github-repository-intelligence.test.js test/repository-review-contract.test.js test/agent-capability-routing.test.js test/capability-routing.test.js test/api-chat-routing.test.js
