name: Clean conversational start
on:
  push:
    paths:
      - 'clarify.js'
      - 'public/create.js'
      - 'public/create.html'
      - 'public/conversation-bubbles.css'
      - 'agent-response-contract.js'
      - 'react-builder.js'
      - 'react-agent.js'
      - 'docs/design/KAIROQ-CONVERSATION-EXPERIENCE.md'
      - 'test/clarify.test.js'
      - 'test/looks.test.js'
      - 'test/clean-conversational-start.test.js'
      - 'test/conversation-experience.test.js'
      - 'test/agent-response-contract.test.js'
      - '.github/workflows/clean-conversational-start.yml'
  pull_request:
    paths:
      - 'clarify.js'
      - 'public/create.js'
      - 'public/create.html'
      - 'test/clarify.test.js'
      - 'test/looks.test.js'
      - 'test/clean-conversational-start.test.js'
      - '.github/workflows/clean-conversational-start.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check clarify.js
      - run: node --check public/create.js
      - run: node --check agent-response-contract.js
      - run: node --check react-builder.js
      - run: node --check react-agent.js
      - run: node --test test/clarify.test.js test/looks.test.js test/clean-conversational-start.test.js test/conversation-experience.test.js test/agent-response-contract.test.js test/natural-chat-build-routing.test.js
