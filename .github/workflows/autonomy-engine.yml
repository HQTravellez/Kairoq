name: Autonomy execution checks
on:
  push:
    branches: [feat/autonomous-api-learning-foundation]
  pull_request:
    paths:
      - 'autonomy-engine.js'
      - 'autonomy-store.js'
      - 'test/autonomy-engine.test.js'
      - 'server.js'
      - 'public/api-studio.html'
      - '.github/workflows/autonomy-engine.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: node --check server.js && node --check autonomy-engine.js && node --check autonomy-store.js
      - name: Autonomy unit tests
        run: node --test test/autonomy-engine.test.js
