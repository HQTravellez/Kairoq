name: Conversational builder contract proof
on:
  push:
    paths:
      - 'react-builder.js'
      - 'conversational-build-contract.js'
      - 'test/conversational-build-contract.test.js'
      - '.github/workflows/conversational-build.yml'
  pull_request:
    paths:
      - 'react-builder.js'
      - 'conversational-build-contract.js'
      - 'test/conversational-build-contract.test.js'
      - '.github/workflows/conversational-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check react-builder.js && node --check conversational-build-contract.js
      - run: node --test test/conversational-build-contract.test.js
