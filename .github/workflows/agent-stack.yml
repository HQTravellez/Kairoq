name: Modular agent stack
on:
  pull_request:
    paths:
      - 'integrations/agent-stack/**'
      - 'scripts/*agent-stack*'
      - 'ecc-context-recall.js'
      - 'react-builder.js'
      - 'react-agent.js'
      - 'server.js'
      - 'create-api.js'
      - 'public/create.js'
      - 'app-concept.js'
      - 'builder-response-policy.js'
      - 'model-output-guard.js'
      - 'test/model-output-guard.test.js'
      - 'test/*discuss*.test.js'
      - 'test/builder-response-policy.test.js'
      - 'test/agent-stack*.test.js'
      - 'test/fixtures/agent-stack/**'
      - '.github/workflows/agent-stack.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node --test test/agent-stack.test.js test/agent-stack-builder.test.js test/ecc-context-recall.test.js test/hermes-learning-loop.test.js test/responsive-builder-chat.test.js test/builder-response-policy.test.js test/concurrent-discuss.test.js test/free-chat-orchestration.test.js test/model-output-guard.test.js
      - run: node scripts/agent-stack.js status
      - run: node scripts/agent-stack.js graph > "$RUNNER_TEMP/agent-stack-graph.json"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-stack-static-graph-node-${{ matrix.node }}
          path: ${{ runner.temp }}/agent-stack-graph.json
