name: Free conversational orchestration
on:
  push:
    paths:
      - 'server.js'
      - 'public-web-fetch.js'
      - 'public/app.js'
      - 'public/index.html'
      - 'runtime-check.js'
      - 'public/kairoq-ui.css'
      - 'test/public-web-fetch.test.js'
      - 'test/main-chat-link-research.test.js'
      - 'test/free-model-picker.test.js'
      - 'test/model-picker.test.js'
      - 'freellmapi.js'
      - 'capability-registry.js'
      - 'api-chat-routing.js'
      - 'browser-chat-routing.js'
      - 'test/freellmapi.test.js'
      - 'react-builder.js'
      - 'test/free-chat-orchestration.test.js'
      - '.github/workflows/free-chat-orchestration.yml'
  pull_request:
    paths:
      - 'server.js'
      - 'public-web-fetch.js'
      - 'public/app.js'
      - 'public/index.html'
      - 'runtime-check.js'
      - 'public/kairoq-ui.css'
      - 'test/public-web-fetch.test.js'
      - 'test/main-chat-link-research.test.js'
      - 'test/free-model-picker.test.js'
      - 'test/model-picker.test.js'
      - 'freellmapi.js'
      - 'capability-registry.js'
      - 'api-chat-routing.js'
      - 'browser-chat-routing.js'
      - 'test/freellmapi.test.js'
      - 'react-builder.js'
      - 'test/free-chat-orchestration.test.js'
      - '.github/workflows/free-chat-orchestration.yml'
permissions:
  contents: read
jobs:
  conversational:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.js && node --check public-web-fetch.js && node --check public/app.js && node --check runtime-check.js && node --check react-builder.js && node --check freellmapi.js && node --check capability-registry.js && node --check api-chat-routing.js && node --check browser-chat-routing.js
      - run: node --test test/free-chat-orchestration.test.js test/freellmapi.test.js test/public-web-fetch.test.js test/main-chat-link-research.test.js test/free-model-picker.test.js test/model-picker.test.js
