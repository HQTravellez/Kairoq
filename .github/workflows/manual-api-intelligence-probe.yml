name: Manual Jev + ScaleDown CDM probe
on:
  workflow_dispatch:
    inputs:
      public_fixture_api_spend_approved:
        description: 'I approve one small Jev and one small ScaleDown model request using only synthetic public test text'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  real-provider-probe:
    if: ${{ inputs.public_fixture_api_spend_approved == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Single bounded trial per external model
        env:
          KAIROQ_ALLOW_PUBLIC_AI_TESTS: YES
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          SCALEDOWN_API_KEY: ${{ secrets.SCALEDOWN_API_KEY }}
          KAIROQ_AI_PROBE_OUT: benchmark-artifacts/api-intelligence-real-probe.json
        run: node scripts/probe-api-intelligence.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-intelligence-real-provider-probe
          path: benchmark-artifacts/api-intelligence-real-probe.json
          if-no-files-found: warn
